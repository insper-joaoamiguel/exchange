spring:
  application:
    name: exchange-service

  datasource:
    url: jdbc:h2:mem:exchangedb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081  # porta diferente do product-service (8080)

exchange:
  api:
    # AwesomeAPI - gratuita, sem necessidade de chave
    base-url: https://economia.awesomeapi.com.br/json/last

management:
  endpoints:
    web:
      exposure:
        include: health